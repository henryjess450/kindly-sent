# Kindly Sent. Runs next to Coastline Prints on the same PC.
# HTTPS comes from the shared Caddy in the "edge" folder, which reaches this
# app over the "web" Docker network. Nothing here opens a public port.
#   docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
      BACKUP_DIR: /backups # one copy a day appears in ./backups
    volumes:
      - kindly-data:/app/data # database
      - ./backups:/backups
    networks:
      web:
        aliases: [kindly-sent]
    ports:
      # Only for checking at http://localhost:3200 on the PC itself.
      - "127.0.0.1:3200:3200"

volumes:
  kindly-data:

networks:
  web:
    external: true
